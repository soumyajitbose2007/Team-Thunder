<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfinding Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pathfinding Visualizer</h1>

  <div id="controls">
    <select id="algo">
      <option value="bfs">BFS</option>
      <option value="dfs">DFS</option>
      <option value="dijkstra">Dijkstra</option>
      <option value="astar">A*</option>
    </select>
    <button id="run">Run</button>
    <button id="maze">Generate Maze</button>
    <button id="clearPath">Clear Path</button>
    <button id="reset">Reset Board</button>
    <select id="size">
      <option value="15,31">Small</option>
      <option value="21,41" selected>Medium</option>
      <option value="31,61">Large</option>
    </select>
    <label><input type="checkbox" id="weightMode"> Weight mode (cost 5)</label>
    <label>Speed <input type="range" id="speed" min="1" max="100" value="80"></label>
  </div>

  <div id="stats">Pick an algorithm and press Run.</div>
  <div id="grid"></div>

  <script src="script.js"></script>
</body>
</html>
